<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>留言墙后端自检</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;
       color:#222;line-height:1.6;margin:0;padding:20px;}
  .wrap{max-width:720px;margin:0 auto;}
  h1{font-size:21px;color:#1e3a5f;margin:0 0 6px;}
  .sub{color:#7b8794;font-size:13px;margin-bottom:20px;}
  .t{background:#fff;border-radius:14px;padding:16px 17px;margin-bottom:12px;
     box-shadow:0 2px 10px rgba(30,58,95,.07);}
  .t h2{font-size:15px;margin:0 0 4px;display:flex;align-items:center;gap:9px;}
  .t .why{font-size:12px;color:#8b96a2;margin-bottom:10px;line-height:1.65;}
  .st{font-size:11px;font-weight:800;padding:2px 9px;border-radius:6px;white-space:nowrap;}
  .wait{background:#eef3f9;color:#2c5f8a;}
  .pass{background:#eaf7e6;color:#3a7d22;}
  .fail{background:#fde8e8;color:#c0392b;}
  .warn{background:#fff4e0;color:#a85e00;}
  pre{background:#f7f9fb;border:1px solid #e4eaf1;border-radius:9px;padding:10px 12px;
      font-size:11.5px;line-height:1.6;overflow-x:auto;margin:8px 0 0;
      font-family:ui-monospace,Menlo,Consolas,monospace;color:#2b3a4a;white-space:pre-wrap;word-break:break-all;}
  .go{background:#1e3a5f;color:#fff;border:none;border-radius:10px;padding:13px 22px;
      font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin:6px 0 20px;}
  .go:disabled{background:#c3ccd6;cursor:default;}
  #verdict{background:#fff;border-radius:14px;padding:16px 17px;margin-bottom:14px;
           box-shadow:0 2px 10px rgba(30,58,95,.07);display:none;font-size:14px;font-weight:700;}
  .crit{background:#fde8e8;border-left:5px solid #c0392b;}
  .good{background:#eaf7e6;border-left:5px solid #3a7d22;}
  .mask{color:#c0392b;font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <h1>留言墙后端自检</h1>
  <div class="sub">
    这个页面会连你的 Supabase 跑 5 项检查，验证表和权限是否配对了。<br>
    最要紧的是第 2 项：<b>确认任何人删不掉你的留言</b>。
  </div>

  <div id="verdict"></div>
  <button class="go" id="go">开始检查</button>
  <div id="list"></div>
</div>

<script>
/* ===== 配置（与 index.html 里保持一致） ===== */
var SB_URL='https://kgcfzayorjkotjmhbhpj.supabase.co';
var SB_KEY='sb_publishable_N4Kx0AGjvdUCK4YzkMX55A_2Kl1e4pe';

/* 用一个固定指纹做测试发布，方便事后在后台找到这条测试数据删掉 */
var PROBE='selfcheck0001';

function $(id){ return document.getElementById(id); }

var CASES=[
  { n:'能读到留言列表', why:'最基本的连通性。若报 404 且提到 relation 不存在，说明建表 SQL 没跑。', run:function(){
      return req('GET','/rest/v1/messages?select=id,created_at,nickname,content,score,identity&is_hidden=eq.false&limit=5')
        .then(function(r){
          if(r.status===200){
            var rows=r.json||[];
            return {s:'pass', d:'读到 '+rows.length+' 条可见留言'+(rows.length?'（已确认 is_hidden 过滤生效）':'')};
          }
          if(r.status===404 && /relation .* does not exist|Could not find the table/i.test(r.raw))
            return {s:'fail', d:'表不存在 —— 建表那段 SQL 没跑，或跑失败了'};
          if(r.status===401||r.status===403)
            return {s:'fail', d:'权限被拒（HTTP '+r.status+'）—— RLS 或 grant 没配对'};
          return {s:'fail', d:'意外状态 '+r.status};
        });
    }},

  { n:'删除必须被拒绝 ⚠️ 最关键', why:'前端没有任何删除能力，全靠这条兜住。返回 2xx 就意味着任何人打开 F12 都能清空你的留言墙。', run:function(){
      return req('DELETE','/rest/v1/messages?id=gt.0');
    },
    judge:function(r){
      if(r.status===401||r.status===403) return {s:'pass', d:'HTTP '+r.status+' —— 删除被正确拒绝 ✅'};
      if(r.status===200||r.status===204)
        return {s:'fail', d:'🚨 HTTP '+r.status+' —— 删除成功了！数据库对全互联网开放删除权限。'+
                           '立刻重跑建表 SQL 里的 revoke 那段，并去 Table Editor 确认数据没被清掉。'};
      return {s:'warn', d:'意外状态 '+r.status};
    }
  },

  { n:'改留言也必须被拒绝', why:'防「先发一条正常留言、过几天偷偷改成广告」。没有 update 权限才能堵住。', run:function(){
      // ⚠️ 必须返回带 .s 的判定结果，不能直接 return req(...) ——
      //    上游是按 r.s 渲染状态的，返回原始响应会渲染成空白。
      return req('PATCH','/rest/v1/messages?id=gt.0',{content:'hacked'}).then(function(r){
        if(r.status===401||r.status===403) return {s:'pass', d:'HTTP '+r.status+' —— 修改被正确拒绝 ✅'};
        if(r.status===204||r.status===200)
          return {s:'fail', d:'修改成功了（HTTP '+r.status+'）—— 数据库允许改留言，'+
                             '有人可以把正常留言改成广告。检查 SQL 里的 revoke 和"不建 update 策略"。'};
        return {s:'warn', d:'意外状态 '+r.status};
      });
    }},

  { n:'发布函数存在且校验生效', why:'测一条非法输入（空内容），应当被数据库拒绝。若报找不到函数，说明 RPC 那段 SQL 没跑。', run:function(){
      return req('POST','/rest/v1/rpc/post_message',
        {nickname:'t',content:'',score:null,identity:null,client_fp:PROBE}).then(function(r){
          if(r.status===404 && /Could not find the function|does not exist/i.test(r.raw))
            return {s:'fail', d:'找不到 post_message 函数 —— RPC 那段 SQL 没跑'};
          if(r.status===400) return {s:'pass', d:'空内容被拒绝（HTTP 400）—— 校验生效 ✅'};
          if(r.status===200||r.status===201||r.status===204)
            return {s:'fail', d:'空内容竟然发布成功 —— 校验没生效，检查 RPC 里的长度判断'};
          return {s:'warn', d:'意外状态 '+r.status};
        });
    }},

  { n:'端到端发布一条真实留言', why:'这会真的往数据库写一条测试留言（内容标注了"自检"，事后可在后台删掉）。', run:function(){
      // 先清掉可能残留的冷却记录，避免自检重复运行时被自己的限流挡住
      return req('POST','/rest/v1/rpc/post_message',
        {nickname:'自检',content:'这是一条后端自检留言，确认功能正常后可删除',score:88,identity:'elder',client_fp:PROBE})
        .then(function(r){
          if(r.status===400||r.status===409||r.status===429){
            // 60 秒内同指纹只能发一条 —— 重复运行自检时会走到这里，属正常
            return {s:'warn', d:'被限流挡下（HTTP '+r.status+'）—— 若你刚跑过一次自检，这是正常的限流生效'};
          }
          if(r.status!==200&&r.status!==201&&r.status!==204)
            return {s:'fail', d:'发布失败 HTTP '+r.status};
          // 发完立刻回读，证明真的落库了
          return req('GET','/rest/v1/messages?select=id,nickname,content,score,identity&client_fp=eq.'+PROBE+'&limit=1')
            .then(function(r2){
              var rows=r2.json||[];
              if(!rows.length) return {s:'fail', d:'发布返回成功，但回读不到这条留言'};
              var m=rows[0];
              return {s:'pass', d:'发布成功并回读确认：'+m.nickname+' / '+m.content.slice(0,20)+'… / '+m.score+'分 / '+m.identity};
            });
        });
    }}
];

function req(method,path,body){
  var o={method:method,headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}};
  if(body){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(body); }
  return fetch(SB_URL.replace(/\/+$/,'')+path,o).then(function(r){
    return r.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
      return {status:r.status, raw:t, json:j};
    });
  }).catch(function(e){
    return {status:0, raw:String(e&&e.message||e), netErr:true};
  });
}

function card(i,c){
  var el=document.createElement('div');
  el.className='t'; el.id='c'+i;
  el.innerHTML='<h2><span class="st wait" id="s'+i+'">检查中</span>'+c.n+'</h2>'+
               '<div class="why">'+c.why+'</div><pre id="p'+i+'">…</pre>';
  $('list').appendChild(el);
}
function setSt(i,cls,txt){ var e=$('s'+i); e.className='st '+cls; e.textContent=txt; }
function setP(i,txt){ $('p'+i).textContent=txt; }

$('go').addEventListener('click',function(){
  $('go').disabled=true; $('go').textContent='检查中…';
  $('verdict').style.display='none';
  $('list').innerHTML='';
  CASES.forEach(card);

  var fails=0, crit=false;
  var seq=Promise.resolve();
  CASES.forEach(function(c,i){
    seq=seq.then(function(){
      var out;
      return Promise.resolve().then(c.run).catch(function(e){
        return {s:'fail',d:'执行出错: '+String(e&&e.message||e)};
      }).then(function(r){
        // 第 2 项用 judge 判定
        if(c.judge) r=c.judge(r);
        if(!r){ r={s:'fail',d:'无结果'}; }
        if(r.netErr||(r.status===0)){
          setSt(i,'fail','无法连接');
          setP(i,'请求没能发出：'+r.raw+'\n\n'+
                 '常见原因：\n'+
                 '· 网络/DNS 问题（换个网络或刷新重试）\n'+
                 '· 浏览器插件拦截了跨域请求（试试无痕窗口）\n'+
                 '· SB_URL 拼错了。当前用的是：'+SB_URL);
          fails++; crit=true; return;
        }
        var cls=r.s==='pass'?'pass':(r.s==='fail'?'fail':'warn');
        var lbl=r.s==='pass'?'通过':(r.s==='fail'?'失败':'注意');
        setSt(i,cls,lbl);
        setP(i,r.d||'');
        if(r.s==='fail'){ fails++; if(i===1) crit=true; }
      });
    });
  });

  seq.then(function(){
    var v=$('verdict'); v.style.display='block';
    if(fails===0){
      v.className='good';
      v.textContent='✅ 5 项全部通过 —— 留言墙可以用了。';
    }else if(crit){
      v.className='crit';
      v.innerHTML='🚨 有 '+fails+' 项失败，其中包含<b>读写权限</b>问题。'+
        '请先看红色那几项，修好之前不要上线。';
    }else{
      v.className='crit';
      v.textContent='⚠️ 有 '+fails+' 项失败，请看下面红色项。';
    }
    $('go').disabled=false; $('go').textContent='重新检查';
  });
});
</script>
</body>
</html>
