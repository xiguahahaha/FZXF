<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>重生之我是反诈先锋</title>
<style>
:root{
  --lapis:#1e3a5f; --lapis2:#2c5f8a; --lapis-bg:#eef3f9;
  --green-bubble:#95ec69; --scam-bubble:#ffffff;
  --gold:#e8b339; --warn:#e6a23c; --bad:#e15554; --ok:#67c23a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--lapis-bg);color:#222;line-height:1.6;}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#f5f6f8;position:relative;overflow-x:hidden;}
.screen{padding:20px 16px 40px;display:none;}
.screen.active{display:block;}
/* 身份牌 */
.h-title{text-align:center;font-size:26px;font-weight:800;color:var(--lapis);margin-top:30px;}
.h-sub{text-align:center;color:#666;font-size:14px;margin:8px 0 26px;line-height:1.7;}
.cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.card{width:30%;max-width:140px;background:#fff;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 4px 14px rgba(30,58,95,.12);cursor:pointer;transition:transform .15s;border:2px solid transparent;}
.card:active{transform:scale(.96);}
.card.mid{border-color:var(--lapis2);}
.card.youth{border-color:#e8964a;}
.card.elder{border-color:#5a9e6f;}
.card img{width:62px;height:62px;object-fit:contain;margin:0 auto 8px;display:block;}
.card h3{font-size:15px;color:var(--lapis);}
.card p{font-size:11px;color:#999;margin-top:2px;}
.card.locked{opacity:.55;}
.hint{text-align:center;color:#999;font-size:12px;margin-top:22px;}
/* 进度条 */
.progress{background:var(--lapis);color:#fff;border-radius:12px;padding:8px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.progress .leak{background:rgba(255,255,255,.18);padding:2px 8px;border-radius:8px;font-size:11px;}
.scene-label{font-size:13px;color:var(--lapis2);font-weight:700;margin:6px 0 10px;display:flex;align-items:center;gap:6px;}
.scene-label::before{content:"";width:4px;height:14px;background:var(--lapis2);border-radius:2px;}
/* 聊天 */
.chat{background:#ededed;border-radius:14px;padding:14px 12px;margin-bottom:16px;}
.bubble{max-width:80%;margin:8px 0;padding:9px 13px;border-radius:12px;font-size:15px;clear:both;position:relative;word-break:break-word;}
.bubble.scam{background:var(--scam-bubble);float:left;border-top-left-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.bubble.me{background:var(--green-bubble);float:right;border-top-right-radius:3px;}
.bubble.sys{float:none;background:#fff7e6;color:#a85e00;max-width:100%;font-size:13px;border-left:3px solid var(--warn);text-align:left;}
.bubble.leak{float:left;background:#fde2e2;color:#9b1c1c;border-top-left-radius:3px;font-size:14px;border-left:3px solid var(--bad);}
.clear{clear:both;}
/* 选项 */
.options{display:flex;flex-direction:column;gap:10px;}
.opt{background:#fff;border:2px solid #e2e8f0;border-radius:12px;padding:13px 14px;font-size:15px;cursor:pointer;transition:.12s;display:flex;align-items:flex-start;gap:8px;}
.opt:active{transform:scale(.98);}
.opt .tag{font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap;margin-top:2px;}
.opt .t-best{background:#eaf7e6;color:var(--ok);}
.opt .t-ok{background:#fff4e0;color:var(--warn);}
.opt .t-bad{background:#fde8e8;color:var(--bad);}
/* 复盘 */
.review-card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.08);}
.review-card h2{font-size:19px;color:var(--lapis);margin-bottom:10px;}
.verdict{font-size:15px;font-weight:700;padding:8px 12px;border-radius:10px;margin-bottom:12px;}
.verdict.safe{background:#eaf7e6;color:var(--ok);}
.verdict.risk{background:#fff4e0;color:var(--warn);}
.verdict.hit{background:#fde8e8;color:var(--bad);}
.review-card p{font-size:14px;color:#444;margin-bottom:8px;}
.kp{background:var(--lapis-bg);border-left:3px solid var(--lapis2);padding:10px 12px;border-radius:8px;font-size:13.5px;color:#33506e;margin:10px 0 16px;}
.btn{display:block;width:100%;background:var(--lapis);color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;}
.btn:active{opacity:.85;}
/* 结局 */
.end-wrap{text-align:center;}
.shield{width:120px;height:120px;margin:10px auto 14px;}
.end-title{font-size:24px;font-weight:800;margin-bottom:6px;}
.end-score{font-size:15px;color:#666;margin-bottom:4px;}
.end-leak{font-size:13px;color:var(--bad);margin-bottom:16px;}
.stat-row{display:flex;justify-content:space-around;background:#fff;border-radius:14px;padding:14px;margin:14px 0;box-shadow:0 3px 10px rgba(0,0,0,.06);}
.stat-row div{text-align:center;}
.stat-row .n{font-size:22px;font-weight:800;color:var(--lapis);}
.stat-row .l{font-size:12px;color:#999;margin-top:2px;}
.share-card{background:linear-gradient(135deg,var(--lapis),var(--lapis2));color:#fff;border-radius:18px;padding:22px 18px;margin:16px 0;}
.share-card .big{font-size:30px;font-weight:900;letter-spacing:1px;}
.share-card .mid{font-size:14px;opacity:.92;margin-top:8px;line-height:1.7;}
.share-card .qr{margin-top:14px;font-size:12px;background:rgba(255,255,255,.15);display:inline-block;padding:6px 12px;border-radius:10px;}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:99;display:none;}
/* 人次统计 */
.stats-line{text-align:center;margin-top:10px;font-size:13px;color:#666;}
.stats-line b{color:var(--lapis2);font-size:17px;font-weight:800;margin:0 2px;}
.end-rank{text-align:center;font-size:14px;color:#7a5c1e;background:#fdf6e3;border:1px solid #f0e0b8;border-radius:10px;padding:10px 12px;margin:2px 0 12px;}
</style>
</head>
<body>
<div id="app">

  <!-- 屏1：身份牌 -->
  <section id="s-identity" class="screen active">
    <div class="h-title">重生之我是反诈先锋</div>
    <div class="h-sub">这一世，别再让养老钱打水漂<br>抽一张身份牌，回到被骗之前</div>
    <div class="cards">
      <div class="card mid" onclick="startLine('mid')">
        <img src="assets/mid.png" alt="中年人">
        <h3>中年人</h3><p>守住养老钱</p>
      </div>
      <div class="card youth" onclick="startLine('youth')">
        <img src="assets/youth.png" alt="青年">
        <h3>青年人</h3><p>帮父母挡坑</p>
      </div>
      <div class="card elder" onclick="startLine('elder')">
        <img src="assets/elder.png" alt="老年">
        <h3>老年人</h3><p>守住棺材本</p>
      </div>
    </div>
    <div class="hint">👨 中年 20 关 · 🧑 青年 15 关 · 👴 老年 15 关 · 每局抽 5 关（中老年互掺 1 关）</div>
    <div class="stats-line">🔥 已有 <b id="visit-num">…</b> 人次完成测试</div>
  </section>

  <!-- 屏2：剧情 -->
  <section id="s-story" class="screen">
    <div class="progress"><span id="p-day">第 3 天 / 共 21 天</span><span class="leak" id="p-leak">泄露 Lv.0</span></div>
    <div class="scene-label" id="scene-label">第 1 关 · 冒充客服退款</div>
    <div class="chat" id="chat"></div>
    <div class="options" id="options"></div>
  </section>

  <!-- 屏3：复盘 -->
  <section id="s-review" class="screen">
    <div class="review-card">
      <h2 id="r-title">本关复盘</h2>
      <div class="verdict" id="r-verdict"></div>
      <p id="r-desc"></p>
      <div class="kp" id="r-kp"></div>
      <button class="btn" id="r-next" onclick="nextLevel()">继续 →</button>
    </div>
  </section>

  <!-- 屏4：结局 -->
  <section id="s-end" class="screen">
    <div class="end-wrap">
      <div class="shield" id="end-shield"></div>
      <div class="end-title" id="end-title"></div>
      <div class="end-score" id="end-score"></div>
      <div class="end-leak" id="end-leak"></div>
      <div class="stat-row">
        <div><div class="n" id="st-clear">0</div><div class="l">守住关数</div></div>
        <div><div class="n" id="st-bust">0</div><div class="l">中招关数</div></div>
        <div><div class="n" id="st-leak">0</div><div class="l">泄露等级</div></div>
      </div>
      <div class="end-rank" id="end-rank"></div>
      <div class="share-card">
        <div class="big" id="sc-title">反诈先锋</div>
        <div class="mid" id="sc-desc"></div>
        <div class="qr">📌 关注「写点知识」· 下次骗局前先练手</div>
      </div>
      <button class="btn" onclick="restart()">↻ 重玩这一世</button>
    </div>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script src="levels.js"></script>
<script>
/* ---- 关卡数据源：本地 levels.js 兜底（离线双击也能玩），线上用数据仓库 FZXF-data 覆盖 ----
   以后加关/改话术只 push 数据仓库即可，网页仓库不用重新部署 ---- */
const DATA_URL='https://xiguahahaha.github.io/FZXF-data/levels.js';
(function(){
  fetch(DATA_URL+'?v='+Date.now(), {cache:'no-store'})
    .then(r=>r.ok?r.text():Promise.reject())
    .then(t=>{ const remote=new Function(t+'\n;return LINE;')();
               if(remote && remote.mid && remote.mid.length && remote.youth && remote.elder){ LINE=remote; } })
    .catch(()=>{});  // 拉不到就用本地兜底，不影响游玩
})();

let state = {identity:null, level:0, leakLevel:0, cleared:0, busted:0, playlist:[]};
let currentOpts=[];
const SAVE_KEY='reborn_antifraud_v1';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---- 全球人次计数：Abacus 免费计数 API + localStorage 降级 ---- */
const COUNT_URL='https://abacus.jasoncameron.dev';
const COUNT_NS='reborn-antifraud-2026', COUNT_KEY='plays';
const GKEY='raf_global_count', LKEY='raf_local_count';
function fetchCount(path, timeout, onOk, onFail){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(), timeout);
  fetch(COUNT_URL+path, {signal:ctl.signal})
    .then(r=>{clearTimeout(t); if(!r.ok) throw 0; return r.text();})
    .then(s=>{ let n=NaN;                                  // 兼容 {"value":1} / 纯文本数字
               try{ const o=JSON.parse(s); if(o && o.value!==undefined) n=parseInt(o.value,10); }catch(e){}
               if(isNaN(n)) n=parseInt(s,10);
               isNaN(n)?onFail():onOk(n); })
    .catch(()=>{clearTimeout(t); onFail();});
}
function showCount(n){ const el=document.getElementById('visit-num'); if(el) el.textContent=n.toLocaleString('zh-CN'); }
function initCount(){
  const cached=parseInt(localStorage.getItem(GKEY)||'0',10);
  if(cached) showCount(cached);
  fetchCount('/get/'+COUNT_NS+'/'+COUNT_KEY, 5000,
    n=>{ localStorage.setItem(GKEY, String(n)); showCount(n); },
    ()=>{ const el=document.getElementById('visit-num'); if(el && !cached) el.textContent='—'; });
}
function bumpCount(){
  fetchCount('/hit/'+COUNT_NS+'/'+COUNT_KEY, 6000,
    n=>{ localStorage.setItem(GKEY, String(n)); showCount(n);
         const rank=document.getElementById('end-rank');
         if(rank) rank.textContent='🔥 恭喜！你是全球第 '+n.toLocaleString('zh-CN')+' 位完成测试的反诈学员'; },
    ()=>{ const loc=parseInt(localStorage.getItem(LKEY)||'0',10)+1;
          localStorage.setItem(LKEY, String(loc));
          const rank=document.getElementById('end-rank');
          if(rank) rank.textContent='🔥 你是本机第 '+loc+' 局完成测试（全球统计暂时不可达）'; });
}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1800);}

function startLine(id){
  const days=[3,7,11,15,19];
  let picks;
  if(id==='mid' && LINE.elder){        // 中年局：本线 4 关 + 老年线掺 1 关
    picks = shuffle([...LINE.mid]).slice(0,4).concat(shuffle([...LINE.elder]).slice(0,1));
  }else if(id==='elder' && LINE.mid){  // 老年局：本线 4 关 + 中年线掺 1 关
    picks = shuffle([...LINE.elder]).slice(0,4).concat(shuffle([...LINE.mid]).slice(0,1));
  }else{                               // 青年局/兜底：纯本线抽 5 关
    picks = shuffle([...(LINE[id]||LINE.mid)]).slice(0,5);
  }
  shuffle(picks); // 掺入的关打乱到 5 关中任意位置
  state={identity:id, level:0, leakLevel:0, cleared:0, busted:0, playlist: picks.map((lv,i)=>({...lv, day:days[i]}))};
  renderLevel();
}

function renderLevel(){
  const lv=state.playlist[state.level];
  document.getElementById('p-day').textContent='第 '+lv.day+' 天 / 共 21 天';
  document.getElementById('p-leak').textContent='泄露 Lv.'+state.leakLevel;
  document.getElementById('scene-label').textContent='第 '+(state.level+1)+' 关 · '+lv.title;
  // chat
  let html='';
  lv.chat.forEach(b=>{html+='<div class="bubble '+b.who+'">'+b.text+'</div>';});
  if(state.leakLevel>0 && lv.leakExtra){html+='<div class="clear"></div><div class="bubble leak">'+lv.leakExtra+'</div>';}
  html+='<div class="clear"></div>';
  document.getElementById('chat').innerHTML=html;
  // options
  currentOpts = shuffle([...lv.options]);
  let oh='';
  currentOpts.forEach((o,i)=>{
    oh+='<div class="opt" onclick="choose('+i+')">'+o.label+'</div>';
  });
  document.getElementById('options').innerHTML=oh;
  show('s-story');
}

function choose(i){
  const lv=state.playlist[state.level];
  const o=currentOpts[i];
  if(o.tag==='best') state.cleared++;
  if(o.leak) {state.leakLevel++; state.busted++;}
  // review
  document.getElementById('r-title').textContent='第 '+(state.level+1)+' 关复盘 · '+lv.title;
  const vd=document.getElementById('r-verdict');
  vd.className='verdict '+o.verdict; vd.textContent=o.vtext+' '+ (o.verdict==='safe'?'成功守住':o.verdict==='risk'?'险中脱险':'被骗中招');
  document.getElementById('r-desc').textContent=o.desc;
  document.getElementById('r-kp').textContent='📌 防骗知识点：'+lv.kp;
  show('s-review');
}

function nextLevel(){
  state.level++;
  if(state.level < state.playlist.length){ renderLevel(); }
  else { endGame(); }
}

function endGame(){
  const score = state.cleared*20 - state.busted*15 - state.leakLevel*6;
  const sc = Math.max(0, score);
  let title, color, desc;
  if(sc>=100){title='🏆 反诈先锋（传说）';color='var(--gold)';desc='五关全守、零泄露！你打断了整条泄露链，这一世养老钱稳如泰山。';}
  else if(sc>=70){title='🛡️ 防骗觉醒者';color='var(--lapis2)';desc='守得不错，但有过虚惊。记住：骗子专挑松懈时下手。';}
  else if(sc>=40){title='⚠️ 险些上当';color='var(--warn)';desc='踩了坑才醒来。信息一旦泄露，后续骗局会精准十倍——下次别给机会。';}
  else {title='💤 待觉醒者';color='var(--bad)';desc='这一世栽了跟头。重生归来，带着记忆，把每一关的验证码都攥紧。';}
  document.getElementById('end-title').textContent=title;
  document.getElementById('end-title').style.color=color;
  document.getElementById('end-score').textContent='综合评分 '+sc+' / 100';
  document.getElementById('end-leak').textContent= state.leakLevel>0 ? ('⚠️ 你被打上"易骗标签"等级 Lv.'+state.leakLevel+' — 信息已流入黑产') : '✅ 零泄露，信息未外流';
  document.getElementById('st-clear').textContent=state.cleared;
  document.getElementById('st-bust').textContent=state.busted;
  document.getElementById('st-leak').textContent=state.leakLevel;
  document.getElementById('sc-title').textContent=title.replace(/[（(].*$/,'');
  const keepLine = state.identity==='youth'?'守住钱包，从练手开始。':state.identity==='elder'?'守住棺材本，从练手开始。':'守住养老钱，从练手开始。';
  document.getElementById('sc-desc').textContent=desc+' '+keepLine;
  // shield svg
  const shieldColor = sc>=100?'#e8b339':sc>=70?'#2c5f8a':sc>=40?'#e6a23c':'#9b1c1c';
  document.getElementById('end-shield').innerHTML='<svg viewBox="0 0 100 100"><path d="M50 6 L88 20 V48 C88 74 70 90 50 96 C30 90 12 74 12 48 V20 Z" fill="'+shieldColor+'" opacity=".18"/><path d="M50 6 L88 20 V48 C88 74 70 90 50 96 C30 90 12 74 12 48 V20 Z" fill="none" stroke="'+shieldColor+'" stroke-width="4"/><text x="50" y="58" font-size="34" text-anchor="middle" fill="'+shieldColor+'">'+(sc>=70?'✓':'!')+'</text></svg>';
  bumpCount();
  show('s-end');
}

function restart(){ show('s-identity'); }

// 读取历史最高分（可选展示，预留）
try{ const best=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'); }catch(e){}
// 页面加载即刷新全球人次显示
initCount();
</script>
